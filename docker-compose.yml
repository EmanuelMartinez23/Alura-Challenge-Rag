services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragm_web
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./Documentos:/app/media/default_documents:ro
    env_file:
      - ./backend/.env
    depends_on:
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ragm_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
